<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Companion</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#111827">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { -webkit-tap-highlight-color: transparent; padding-bottom: 70px; }
        button { min-height: 48px; transition: transform 0.1s, opacity 0.1s; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 50; animation: fade 2s forwards; }
        @keyframes fade { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
        .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: #16a34a; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; z-index: 50; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { background: #4f46e5; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="max-w-md mx-auto p-4">
        <h1 class="text-xl font-bold text-center">Baby Companion</h1>
        <p class="text-center text-xs text-gray-400 mb-4">Open · Self-hosted · Private</p>

        <!-- LOG TAB -->
        <div id="tab-log" class="tab-content active">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="logMilk('breast')" class="bg-pink-600 rounded-xl p-4 font-semibold">Mom’s Milk</button>
                <button onclick="logMilk('formula')" class="bg-cyan-600 rounded-xl p-4 font-semibold">Formula Milk</button>
                <button onclick="logWeight()" class="bg-amber-600 rounded-xl p-4 font-semibold col-span-2">Log Weight</button>
                <button onclick="quickLog('diaper', {type: 'wet'})" class="bg-green-600 rounded-xl p-4 font-semibold">Wet</button>
                <button onclick="quickLog('diaper', {type: 'dirty'})" class="bg-green-600 rounded-xl p-4 font-semibold">Dirty</button>
                <button onclick="startSleep()" class="bg-purple-600 rounded-xl p-4 font-semibold">Start Sleep</button>
                <button onclick="endSleep()" class="bg-purple-800 rounded-xl p-4 font-semibold">End Sleep</button>
                <button onclick="startWhisper()" class="bg-orange-600 rounded-xl p-4 font-semibold col-span-2">Voice Log</button>
            </div>
            <div id="sleep-timer" class="hidden mb-4 bg-purple-900/40 rounded-xl p-4 text-center">
                <p class="text-sm text-purple-300">Sleep timer</p>
                <p id="sleep-elapsed" class="text-3xl font-mono font-bold">00:00</p>
                <p class="text-xs text-gray-400">Started <span id="sleep-started"></span></p>
            </div>
            <div class="mb-4 bg-gray-800 rounded-xl p-4">
                <h2 class="text-sm font-semibold mb-2">Feed Reminder</h2>
                <div class="flex gap-2">
                    <select id="reminder-hours" class="bg-gray-700 rounded-lg p-2 flex-1 text-sm">
                        <option value="2">Every 2h</option>
                        <option value="3" selected>Every 3h</option>
                        <option value="4">Every 4h</option>
                    </select>
                    <button onclick="toggleReminder()" id="reminder-btn" class="bg-indigo-600 rounded-lg px-4 text-sm">Start</button>
                </div>
                <p id="reminder-status" class="text-xs text-gray-400 mt-2"></p>
                <p id="reminder-countdown" class="text-2xl font-mono text-center mt-1 hidden">00:00:00</p>
            </div>
            <div id="milk-picker" class="hidden mb-4 bg-gray-800 rounded-xl p-4">
                <div id="feed-timer" class="mb-3 text-center">
                    <p class="text-sm text-pink-300">Feed timer</p>
                    <p id="feed-elapsed" class="text-3xl font-mono font-bold">00:00</p>
                    <p class="text-xs text-gray-400">Started <span id="feed-started"></span></p>
                </div>
                <p class="text-sm mb-2">Amount (ml)</p>
                <div class="flex gap-2">
                    <button onclick="setMl(30)" class="flex-1 bg-gray-700 rounded-lg py-2">30</button>
                    <button onclick="setMl(60)" class="flex-1 bg-gray-700 rounded-lg py-2">60</button>
                    <button onclick="setMl(90)" class="flex-1 bg-gray-700 rounded-lg py-2">90</button>
                    <button onclick="setMl(120)" class="flex-1 bg-gray-700 rounded-lg py-2">120</button>
                </div>
                <input id="custom-ml" type="number" placeholder="Custom ml" class="w-full mt-2 bg-gray-700 rounded-lg p-2">
                <input id="formula-name" type="text" placeholder="Formula name (optional)" class="w-full mt-2 bg-gray-700 rounded-lg p-2 text-sm hidden">
                <p class="text-sm mt-3 mb-1">Duration (min)</p>
                <div class="flex gap-2">
                    <button onclick="setDuration(5)" class="flex-1 bg-gray-700 rounded-lg py-2 text-sm">5</button>
                    <button onclick="setDuration(10)" class="flex-1 bg-gray-700 rounded-lg py-2 text-sm">10</button>
                    <button onclick="setDuration(15)" class="flex-1 bg-gray-700 rounded-lg py-2 text-sm">15</button>
                    <button onclick="setDuration(20)" class="flex-1 bg-gray-700 rounded-lg py-2 text-sm">20</button>
                </div>
                <input id="custom-duration" type="number" placeholder="Custom min" class="w-full mt-2 bg-gray-700 rounded-lg p-2">
                <button onclick="endFeed()" class="w-full mt-2 bg-pink-600 rounded-lg py-2">End Feed & Log</button>
                <button onclick="cancelMilk()" class="w-full mt-1 text-sm text-gray-400">Cancel</button>
            </div>
            <div id="weight-picker" class="hidden mb-4 bg-gray-800 rounded-xl p-4">
                <p class="text-sm mb-2">Weight (g)</p>
                <input id="weight-g" type="number" placeholder="e.g. 3200" class="w-full bg-gray-700 rounded-lg p-2">
                <button onclick="confirmWeight()" class="w-full mt-2 bg-amber-600 rounded-lg py-2">Log Weight</button>
                <button onclick="document.getElementById('weight-picker').classList.add('hidden')" class="w-full mt-1 text-sm text-gray-400">Cancel</button>
            </div>
        </div>

        <!-- ACTIVITY TAB -->
        <div id="tab-activity" class="tab-content">
            <h2 class="text-lg font-semibold mb-2">Recent Events</h2>
            <div id="events" class="space-y-2 text-sm"></div>
        </div>

        <!-- INSIGHTS TAB -->
        <div id="tab-insights" class="tab-content">
            <button onclick="loadHandoff()" class="w-full bg-emerald-700 hover:bg-emerald-800 rounded-xl p-3 mb-2 text-sm font-semibold">Shift Handoff</button>
            <button onclick="loadVisitBrief()" class="w-full bg-indigo-700 hover:bg-indigo-800 rounded-xl p-3 mb-4 text-sm font-semibold">Generate 811 / Clinic Brief</button>
            <div class="flex gap-2 mb-4">
                <button onclick="loadInsights()" class="flex-1 bg-yellow-700 rounded-xl p-3 text-sm">Insights</button>
                <button onclick="loadSummary()" class="flex-1 bg-teal-700 rounded-xl p-3 text-sm">Today</button>
            </div>
            <div id="insights-box" class="bg-gray-800 rounded-xl p-4 text-sm min-h-[100px]"></div>
            <div id="visit-brief" class="hidden mt-4 bg-gray-800 rounded-xl p-4 text-sm"></div>
        </div>

        <!-- ASK TAB -->
        <div id="tab-ask" class="tab-content">
            <h2 class="text-lg font-semibold mb-2">Ask Documents</h2>
            <div id="chat-messages" class="space-y-2 mb-3 text-sm max-h-64 overflow-y-auto"></div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="Ask about feeds, sleep..." class="flex-1 bg-gray-700 rounded-lg p-3 text-sm">
                <button onclick="sendChat()" class="bg-indigo-600 rounded-lg px-4">Send</button>
            </div>
        </div>

        <!-- DOCS TAB -->
        <div id="tab-docs" class="tab-content">
            <h2 class="text-lg font-semibold mb-2">Documents</h2>
            <input type="file" id="fileInput" accept=".pdf,.txt,.md" class="w-full text-sm mb-2">
            <button onclick="uploadDocument()" class="w-full bg-indigo-600 rounded-lg p-3 mb-3">Upload PDF</button>
            <h3 class="text-sm font-semibold mt-4">Clinic Visit</h3>
            <button id="clinic-start" onclick="startClinic()" class="w-full bg-rose-600 rounded-lg p-3 mb-2">Start Clinic Visit</button>
            <button id="clinic-stop" onclick="stopClinic()" class="w-full bg-rose-800 rounded-lg p-3 mb-2 hidden">End & Summarize</button>
            <p id="clinic-timer" class="text-center text-sm hidden">00:00</p>
            <input type="file" id="clinicAudio" accept="audio/*" class="w-full text-sm mb-2 mt-2">
            <button onclick="scribeVisit()" class="w-full bg-rose-700 rounded-lg p-3">Upload Voice Memo</button>
            <div id="scribe-result" class="mt-2 text-sm"></div>
            <div id="upload-status" class="mt-2 text-sm"></div>
            <div id="doc-list" class="mt-2 text-xs text-gray-400"></div>
        </div>
    </div>

    <!-- Bottom nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 flex justify-around py-2">
        <button onclick="showTab('log', this)" class="nav-btn active flex-1 text-xs py-2">Log</button>
        <button onclick="showTab('activity', this)" class="nav-btn flex-1 text-xs py-2">Activity</button>
        <button onclick="showTab('insights', this)" class="nav-btn flex-1 text-xs py-2">Insights</button>
        <button onclick="showTab('ask', this)" class="nav-btn flex-1 text-xs py-2">Ask</button>
        <button onclick="showTab('docs', this)" class="nav-btn flex-1 text-xs py-2">Docs</button>
    </nav>

    <script>
        function showTab(name, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            if (el) el.classList.add('active');
            if (name === 'activity') loadEvents();
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
            if (name === 'docs') loadDocs();
        }

        let pendingSide = null;
        let selectedDuration = 10;
        let sleepStart = null;
        let sleepInterval = null;
        let reminderTimer = null;
        let reminderActive = false;

        function formatMST(iso) {
            if (!iso) return '';
            let s = iso;
            if (!s.endsWith('Z') && !s.includes('+')) s = s.replace(' ', 'T') + 'Z';
            return new Date(s).toLocaleString('en-CA', { timeZone: 'America/Edmonton', hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });
        }

        async function quickLog(type, data) {
            await fetch('/events', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type, data, source: 'manual' })
            });
            showToast('Logged');
            loadEvents();
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        let pendingMilkType = null;
        let selectedMl = 60;

        let feedStart = null;
        let feedInterval = null;
        let feedType = null;

        async function startFeed(type) {
            feedType = type;
            feedStart = new Date();
            document.getElementById('feed-timer').classList.remove('hidden');
            document.getElementById('feed-started').textContent = feedStart.toLocaleTimeString('en-CA', { timeZone: 'America/Edmonton', hour: '2-digit', minute: '2-digit' });
            if (feedInterval) clearInterval(feedInterval);
            feedInterval = setInterval(updateFeedTimer, 1000);
            document.getElementById('milk-picker').classList.remove('hidden');
        }

        function updateFeedTimer() {
            if (!feedStart) return;
            const secs = Math.floor((Date.now() - feedStart.getTime()) / 1000);
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('feed-elapsed').textContent = `${m}:${s}`;
        }

        async function endFeed() {
            if (feedInterval) clearInterval(feedInterval);
            const elapsed = feedStart ? Math.floor((Date.now() - feedStart.getTime()) / 1000) : 0;
            document.getElementById('feed-timer').classList.add('hidden');
            const custom = document.getElementById('custom-ml').value;
            const ml = custom ? parseInt(custom) : selectedMl;
            const name = document.getElementById('formula-name').value.trim();
            const data = {
                type: feedType,
                amount_ml: ml,
                duration_sec: elapsed,
                started: feedStart ? feedStart.toISOString() : null
            };
            if (name && feedType === 'formula') data.formula_name = name;
            await quickLog('feed', data);
            feedStart = null;
            feedType = null;
            document.getElementById('milk-picker').classList.add('hidden');
        }

        function logMilk(type) {
            pendingMilkType = type;
            feedType = type;
            feedStart = new Date();
            document.getElementById('milk-picker').classList.remove('hidden');
            document.getElementById('formula-name').classList.toggle('hidden', type !== 'formula');
            document.getElementById('feed-started').textContent = feedStart.toLocaleTimeString('en-CA', { timeZone: 'America/Edmonton', hour: '2-digit', minute: '2-digit' });
            if (feedInterval) clearInterval(feedInterval);
            feedInterval = setInterval(updateFeedTimer, 1000);
        }

        function logWeight() {
            document.getElementById('weight-picker').classList.remove('hidden');
        }
        async function confirmWeight() {
            const g = parseInt(document.getElementById('weight-g').value) || 0;
            if (g) await quickLog('weight', { grams: g });
            document.getElementById('weight-picker').classList.add('hidden');
        }
        function setMl(ml) { selectedMl = ml; }
        async function confirmMilk() {
            const custom = document.getElementById('custom-ml').value;
            const ml = custom ? parseInt(custom) : selectedMl;
            const name = document.getElementById('formula-name').value.trim();
            const data = { type: pendingMilkType, amount_ml: ml };
            if (name && pendingMilkType === 'formula') data.formula_name = name;
            await quickLog('feed', data);
            cancelMilk();
        }
        function cancelMilk() {
            document.getElementById('milk-picker').classList.add('hidden');
            pendingMilkType = null;
        }

        function logFeed(side) {
            pendingSide = side;
            document.getElementById('duration-picker').classList.remove('hidden');
        }
        function setDuration(m) { selectedDuration = m; }
        async function confirmFeed() {
            const custom = document.getElementById('custom-duration').value;
            const mins = custom ? parseInt(custom) : selectedDuration;
            await quickLog('feed', { side: pendingSide, duration_min: mins });
            cancelFeed();
        }
        function cancelFeed() {
            document.getElementById('duration-picker').classList.add('hidden');
            pendingSide = null;
        }

        async function startSleep() {
            sleepStart = new Date();
            document.getElementById('sleep-timer').classList.remove('hidden');
            document.getElementById('sleep-started').textContent = sleepStart.toLocaleTimeString('en-CA', { timeZone: 'America/Edmonton', hour: '2-digit', minute: '2-digit' });
            if (sleepInterval) clearInterval(sleepInterval);
            sleepInterval = setInterval(updateSleepTimer, 1000);
            await quickLog('sleep', { action: 'start' });
        }
        function updateSleepTimer() {
            if (!sleepStart) return;
            const secs = Math.floor((Date.now() - sleepStart.getTime()) / 1000);
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('sleep-elapsed').textContent = `${m}:${s}`;
        }
        async function endSleep() {
            if (sleepInterval) clearInterval(sleepInterval);
            const elapsed = sleepStart ? Math.floor((Date.now() - sleepStart.getTime()) / 1000) : 0;
            document.getElementById('sleep-timer').classList.add('hidden');
            sleepStart = null;
            await quickLog('sleep', { action: 'end', duration_sec: elapsed });
        }

        let reminderEnd = null;
        let countdownInterval = null;

        function updateCountdown() {
            if (!reminderEnd) return;
            const left = Math.max(0, Math.floor((reminderEnd - Date.now()) / 1000));
            const h = Math.floor(left / 3600).toString().padStart(2, '0');
            const m = Math.floor((left % 3600) / 60).toString().padStart(2, '0');
            const s = (left % 60).toString().padStart(2, '0');
            document.getElementById('reminder-countdown').textContent = `${h}:${m}:${s}`;
            if (left <= 0) {
                clearInterval(countdownInterval);
            }
        }

        function toggleReminder() {
            const btn = document.getElementById('reminder-btn');
            const status = document.getElementById('reminder-status');
            const cd = document.getElementById('reminder-countdown');
            if (reminderActive) {
                clearInterval(reminderTimer);
                clearInterval(countdownInterval);
                reminderActive = false;
                reminderEnd = null;
                btn.textContent = 'Start';
                status.textContent = 'Stopped';
                cd.classList.add('hidden');
                return;
            }
            Notification.requestPermission().then(() => {
                const hours = parseInt(document.getElementById('reminder-hours').value) || 3;
                reminderActive = true;
                btn.textContent = 'Stop';
                status.textContent = `Every ${hours}h`;
                reminderEnd = Date.now() + hours * 3600 * 1000;
                cd.classList.remove('hidden');
                updateCountdown();
                countdownInterval = setInterval(updateCountdown, 1000);
                reminderTimer = setInterval(() => {
                    new Notification('ABC', { body: `Feed check (${hours}h)` });
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = 880;
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.4);
                    } catch (e) {}
                    const url = document.getElementById('reminder-webhook').value.trim();
                    if (url) {
                        fetch(url, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ message: `Time to feed (${hours}h check)`, type: 'feed_reminder' })
                        }).catch(() => {});
                    }
                    // restart countdown
                    reminderEnd = Date.now() + hours * 3600 * 1000;
                }, hours * 3600 * 1000);
            });
        }

        let mediaRecorder = null;
        let audioChunks = [];

        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-lg text-sm z-50';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function startWhisper() {
            showToast('Listening... speak now');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    showToast('Processing...');
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const fd = new FormData();
                    fd.append('file', blob, 'voice.webm');
                    try {
                        const res = await fetch('/api/voice', { method: 'POST', body: fd });
                        const data = await res.json();
                        if (data.transcript) {
                            await fetch(`/api/voice-agent?transcript=${encodeURIComponent(data.transcript)}`, { method: 'POST' });
                            showToast('Logged: ' + data.transcript.slice(0, 40));
                            loadEvents();
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
                        } else {
                            showToast('No speech detected');
                        }
                    } catch (err) {
                        showToast('Voice error');
                    }
                    stream.getTracks().forEach(t => t.stop());
                };
                recorder.start();
                setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 6000);
            } catch (e) {
                showToast('Mic blocked — use localhost');
            }
        }

        function startVoice() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = e => {
                const text = e.results[0][0].transcript.toLowerCase();
                if (text.includes('left')) logFeed('left');
                else if (text.includes('right')) logFeed('right');
                else if (text.includes('wet')) quickLog('diaper', { type: 'wet' });
                else if (text.includes('dirty')) quickLog('diaper', { type: 'dirty' });
                else if (text.includes('sleep')) startSleep();
                else quickLog('note', { text });
            };
            rec.start();
        }

        async function loadEvents() {
            const res = await fetch('/events?limit=30');
            const events = await res.json();
            const el = document.getElementById('events');
            el.innerHTML = events.map(e => {
                let detail = '';
                if (e.type === 'feed') {
                    const t = e.data.type === 'breast' ? 'Mom’s Milk' : (e.data.type === 'formula' ? 'Formula' : '');
                    const name = e.data.formula_name ? ` (${e.data.formula_name})` : '';
                    const mins = e.data.duration_sec ? Math.round(e.data.duration_sec / 60) : '';
                    detail = `${t}${name} · ${e.data.amount_ml || ''} ml${mins ? ' · ' + mins + ' min' : ''}`;
                } else if (e.type === 'weight') {
                    detail = `${e.data.grams} g`;
                }
                if (e.type === 'diaper') detail = e.data.type || '';
                if (e.type === 'sleep') detail = e.data.action || '';
                return `<div class="bg-gray-800 rounded-lg p-3">${formatMST(e.timestamp)} — ${e.type} ${detail}</div>`;
            }).join('') || '<p class="text-gray-500">No events yet</p>';
        }

        async function loadHandoff() {
            const res = await fetch('/api/handoff?hours=8');
            const data = await res.json();
            document.getElementById('insights-box').innerHTML = `<p class="font-semibold">Shift Handoff</p><p class="mt-1">${data.briefing}</p>`;
        }

        function fmt(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                return d.toLocaleString('en-CA', { timeZone: 'America/Edmonton', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return iso;
            }
        }

        async function loadVisitBrief() {
            const box = document.getElementById('visit-brief');
            box.classList.remove('hidden');
            box.innerHTML = '<p>Loading brief...</p>';
            try {
                const res = await fetch('/api/visit-brief');
                if (!res.ok) {
                    box.innerHTML = `<p class="text-red-400">Error ${res.status}</p>`;
                    return;
                }
                const data = await res.json();
                const t = data.totals || {};
                box.innerHTML = `
                    <strong>811 / Clinic Visit Brief</strong>
                    <div class="mt-2 space-y-1 text-xs">
                        <p><b>Feeds</b> 24h: ${t.feeds?.['24h']||0} | 48h: ${t.feeds?.['48h']||0} | 72h: ${t.feeds?.['72h']||0}</p>
                        <p><b>Mom’s Milk</b> 24h: ${t.breast_ml?.['24h']||0} ml</p>
                        <p><b>Formula</b> 24h: ${t.formula_ml?.['24h']||0} ml</p>
                        <p><b>Wet</b> 24h: ${t.wet?.['24h']||0}</p>
                        <p><b>Dirty</b> 24h: ${t.dirty?.['24h']||0}</p>
                        <p><b>Weight</b> latest: ${(data.details?.weights||[]).slice(-1)[0]?.data?.grams || 'n/a'} g</p>
                    </div>
                    ${(data.flags||[]).length ? '<p class="mt-2 font-semibold">Flags</p><ul class="list-disc list-inside">' + data.flags.map(f => `<li>${f}</li>`).join('') + '</ul>' : ''}
                    <details class="mt-2"><summary class="cursor-pointer font-semibold">Feed details</summary><ul class="list-disc list-inside text-xs mt-1">${(data.details?.feeds||[]).map(f => `<li>${fmt(f.time)} · ${f.data.amount_ml||''} ml ${f.data.type||''}</li>`).join('')}</ul></details>
                    <details class="mt-1"><summary class="cursor-pointer font-semibold">Diaper details</summary><ul class="list-disc list-inside text-xs mt-1">${(data.details?.diapers||[]).map(d => `<li>${fmt(d.time)} · ${d.data.type||''}</li>`).join('')}</ul></details>
                    <button onclick="copyBrief()" class="mt-3 w-full bg-gray-700 rounded-lg py-2 text-xs">Copy for 811 Call</button>
                `;
                window._briefText = data.copy_text || '';
            } catch (e) {
                box.innerHTML = `<p class="text-red-400">Failed: ${e.message}</p>`;
            }
        }

        function copyBrief() {
            if (window._briefText) {
                navigator.clipboard.writeText(window._briefText);
                alert('Copied to clipboard');
            }
        }

        async function loadInsights() {
            const res = await fetch('/insights');
            const data = await res.json();
            const box = document.getElementById('insights-box');
            box.innerHTML = data.flags.length
                ? `<strong>Insights</strong><ul class="list-disc list-inside mt-2">${data.flags.map(f => `<li>${f}</li>`).join('')}</ul><p class="mt-2 text-xs">Weight: ${data.latest_weight || 'n/a'} g</p>`
                : `<strong>Insights</strong><p class="mt-2">No flags. Feeds: ${data.feeds_24h}, Wet: ${data.wet_24h}</p><p class="text-xs">Weight: ${data.latest_weight || 'n/a'} g</p>`;
        }
        async function loadSummary() {
            const res = await fetch('/summary/today');
            const data = await res.json();
            document.getElementById('insights-box').innerHTML = `<strong>Today</strong><p class="mt-2">${data.summary}</p>`;
        }

        async function sendChat() {
            const q = document.getElementById('chat-input').value.trim();
            if (!q) return;
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="bg-indigo-800 rounded-lg p-2 text-right">${q}</div>`;
            document.getElementById('chat-input').value = '';
            const res = await fetch(`/api/logs/ask?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            chat.innerHTML += `<div class="bg-gray-800 rounded-lg p-2"><strong>Logs</strong><br>${data.answer || 'No match'}</div>`;
            // also try documents
            const res2 = await fetch(`/rag/query?q=${encodeURIComponent(q)}`);
            const data2 = await res2.json();
            const points = (data2.points || []).map(p => `<li>${p}</li>`).join('');
            chat.innerHTML += `<div class="bg-gray-800 rounded-lg p-2 mt-1"><strong>Docs</strong><br>${data2.answer || 'No document match'}<ul class="list-disc list-inside">${points}</ul></div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        let clinicRecorder = null;
        let clinicChunks = [];
        let clinicStartTime = null;
        let clinicInterval = null;
        let wakeLock = null;

        async function startClinic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                clinicRecorder = new MediaRecorder(stream);
                clinicChunks = [];
                clinicRecorder.ondataavailable = e => clinicChunks.push(e.data);
                clinicRecorder.start();
                clinicStartTime = Date.now();
                document.getElementById('clinic-start').classList.add('hidden');
                document.getElementById('clinic-stop').classList.remove('hidden');
                document.getElementById('clinic-timer').classList.remove('hidden');
                clinicInterval = setInterval(() => {
                    const s = Math.floor((Date.now() - clinicStartTime) / 1000);
                    document.getElementById('clinic-timer').textContent = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
                }, 1000);
                if (navigator.wakeLock) {
                    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
                }
            } catch (e) {
                alert('Microphone access needed. Use localhost or HTTPS.');
            }
        }

        async function stopClinic() {
            if (!clinicRecorder) return;
            clinicRecorder.stop();
            clinicRecorder.onstop = async () => {
                if (clinicInterval) clearInterval(clinicInterval);
                if (wakeLock) { try { await wakeLock.release(); } catch(e) {} }
                document.getElementById('clinic-stop').classList.add('hidden');
                document.getElementById('clinic-start').classList.remove('hidden');
                document.getElementById('clinic-timer').classList.add('hidden');
                const blob = new Blob(clinicChunks, { type: 'audio/webm' });
                const fd = new FormData();
                fd.append('file', blob, 'visit.webm');
                document.getElementById('scribe-result').textContent = 'Summarizing visit...';
                const res = await fetch('/api/visits/scribe', { method: 'POST', body: fd });
                const data = await res.json();
                showScribeResult(data);
            };
        }

        async function scribeVisit() {
            const file = document.getElementById('clinicAudio').files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('file', file);
            document.getElementById('scribe-result').textContent = 'Transcribing...';
            const res = await fetch('/api/visits/scribe', { method: 'POST', body: fd });
            const data = await res.json();
            showScribeResult(data);
        }

        function showScribeResult(data) {
            const p = data.plan || {};
            const heard = (data.transcript || '').slice(0, 300) || '(no speech detected)';
            document.getElementById('scribe-result').innerHTML = `
                <p class="font-semibold mt-2">Extracted plan</p>
                <p>Weight: ${p.weight_g || 'n/a'} g</p>
                <p>Feeding: ${p.feeding_plan_updates || ''}</p>
                <p>Meds: ${p.medications || ''}</p>
                <p>Next: ${p.next_visit || ''}</p>
                <p class="mt-2 text-xs text-gray-400">Heard: ${heard}</p>
                ${p.weight_g ? `<button onclick="quickLog('weight', {grams: ${p.weight_g}})" class="mt-2 bg-amber-600 rounded px-3 py-1 text-xs">Save weight</button>` : ''}
            `;
        }

        async function uploadDocument() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch('/documents', { method: 'POST', body: fd });
            const data = await res.json();
            document.getElementById('upload-status').textContent = `Uploaded: ${data.title} (${data.chars} chars)`;
            loadDocs();
        }
        async function loadDocs() {
            const res = await fetch('/documents');
            const docs = await res.json();
            document.getElementById('doc-list').textContent = 'Loaded: ' + docs.map(d => d.title).join(', ');
        }

        loadEvents();
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
    </script>
</body>
</html>
